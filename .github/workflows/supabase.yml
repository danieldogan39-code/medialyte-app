# Spielt Datenbank, Anmelde-Einstellungen und Cloud-Funktionen in Supabase ein
# und verbindet das Buchungsformular von medialyte.de mit der App.
# Benötigt die Repository-Secrets SUPABASE_ACCESS_TOKEN und (für die Website-Verbindung) IONOS_SFTP_HOST/USER/PASS.
name: Supabase aktualisieren

# Läuft bei jeder Änderung in supabase/ (Daniel hat am 30.10.2026 freigegeben: Einspielen ohne Rückfrage,
# immer erst nach bestandenen Tests: tools/test/run.sh).
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: bddogrluopqgeqvqzqmy
  APP_URL: https://app.medialyte.de
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zugang prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt (Repo → Settings → Secrets and variables → Actions)."; exit 1
          fi

      - name: Datenbank-Updates einspielen
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
            if [ "$code" -ge 300 ]; then cat /tmp/out.txt; echo "::error::$f fehlgeschlagen (HTTP $code)"; exit 1; fi
          done

      - name: Anmeldung absichern (keine Registrierung von außen, Zwei-Faktor an, App-Adressen erlaubt)
        run: |
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          curl -sS -f "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/auth.json
          # bestehende erlaubte Adressen (z. B. der Rechnungs-App) behalten, die der App ergänzen
          liste=$(jq -r '.uri_allow_list // ""' /tmp/auth.json | tr ',' '\n' | sed '/^$/d' \
            | cat - <(printf '%s\n' "$APP_URL/**" "tauri://localhost/**" "http://tauri.localhost/**" "https://tauri.localhost/**" "capacitor://localhost/**" "https://localhost/**" "http://localhost:5173/**") \
            | sort -u | paste -sd, -)
          jq -n --arg l "$liste" '{disable_signup: true, mfa_totp_enroll_enabled: true, mfa_totp_verify_enabled: true,
                                   mfa_max_enrolled_factors: 10, uri_allow_list: $l}' > /tmp/patch.json
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X PATCH "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" --data @/tmp/patch.json)
          if [ "$code" -ge 300 ]; then cat /tmp/out.txt; echo "::error::Anmelde-Einstellungen nicht gesetzt (HTTP $code)"; exit 1; fi
          echo "Registrierung gesperrt, Zwei-Faktor aktiv."

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Schlüssel für die Website-Verbindung festlegen
        run: |
          # Wird aus dem vorhandenen Secret abgeleitet: niemand muss ihn sehen oder abtippen
          key=$(printf 'medialyte-anfrage:%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$key"
          echo "WEBHOOK_SECRET=$key" >> "$GITHUB_ENV"
          supabase secrets set --project-ref "$PROJECT_REF" WEBHOOK_SECRET="$key" APP_URL="$APP_URL" >/dev/null
          echo "Schlüssel gesetzt."

      - name: Cloud-Funktionen veröffentlichen
        run: |
          supabase functions deploy anfrage --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy team --project-ref "$PROJECT_REF"

      - name: Buchungsformular von medialyte.de verbinden und bisherige Anfragen übernehmen
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::warning::IONOS-Secrets fehlen – Website-Verbindung übersprungen."; exit 0
          fi
          sudo apt-get install -y -qq lftp >/dev/null
          url="https://$PROJECT_REF.supabase.co/functions/v1/anfrage"
          python3 - <<'PY'
          import os
          k = os.environ["WEBHOOK_SECRET"]
          open("/tmp/config-app.php", "w").write("<?php\nreturn ['webhook_url' => 'https://%s.supabase.co/functions/v1/anfrage', 'webhook_secret' => '%s'];\n" % (os.environ["PROJECT_REF"], k))
          PY
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "set sftp:auto-confirm yes; put /tmp/config-app.php -o /medialyte-neu/api/config-app.php; get /medialyte-neu/api/data/bookings.jsonl -o /tmp/bookings.jsonl; bye" || true
          rm -f /tmp/config-app.php
          if [ -s /tmp/bookings.jsonl ]; then
            jq -cs '.' /tmp/bookings.jsonl > /tmp/alle.json
            sig=$(openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r /tmp/alle.json | cut -d' ' -f1)
            curl -sS -f -X POST "$url" -H "Content-Type: application/json" -H "X-Medialyte-Signature: sha256=$sig" --data-binary @/tmp/alle.json
            echo; echo "Bisherige Anfragen übernommen."
          fi
          rm -f /tmp/bookings.jsonl /tmp/alle.json
