[package]
name = "medialyte"
version = "0.2.2"
description = "Medialyte – Akquise, Anfragen, Kunden und Rechnungen"
authors = ["Medialyte"]
edition = "2021"

[lib]
name = "medialyte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
